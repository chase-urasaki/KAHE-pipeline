[Target]
# Must be resolvable
name = 
date = 
alt_name = 

[Stellar Parameters]
# Get V_sys from SIMBAD
V_SYS = -26.64e3 # m/s
logg = #cgs
Teff = # K
Z = # Dex 

[Planet Parameters]
name = # a, b, c  
# Time of conjunction in MJD
T_c = # MJD
# Transit duration in hours
T_dur = # hours
# Orbital period in days
P = # days
# Keplerian orbital velocity in m/s
K_p = # m/s

[Calibrations]

master_flat_path = ''
master_dark_path = ''

[File Lists]
# List of files to be processed
flats = 
darks = 
science = 

[Pixel Masking]
dark_sigma = 5
flat_sigma = 5
cosmic_rays_sigma = 5

[Filters]
filter = NIRSPEC1_70
#filter = HeI_70


[Molecfit]
run = True 

[Extraction Method]
method = optimal

[Analysis]
speed_of_light = 3e8
SYSREM_ITERATIONS = 1
INJECT_SIGNAL = False
HIGH_ERROR = 1
GRID_RES = 110000
BOXCAR_FILTER_WINDOW = 4

[BATMAN]
# TOI-2123.01
# Planet source: ExoFOP
# Stellar source: TICv8

# Rp/Rstar from Rp = 4.0217 R_earth and Rstar = 0.8437 R_sun
R_P = 0.04365

# Period in hours
per = 247.41243

# a/Rstar, computed from P = 10.3088514 d and Mstar = 0.950 Msun
a = 23.23

# Near-central estimate; duration is slightly long relative to adopted a/Rstar
inc = 89.75

ecc = 0.0
w = 90.0

[PWINDS]
# Target: TOI-2123.01 / TIC 105840719
# Planet source: ExoFOP
# Stellar source: TICv8
# TOI-2123.01 is listed as a planet candidate, not a confirmed planet.

# Planet radius in Jupiter radii
# Rp = 4.021746 R_earth = 0.358797 R_Jup
R_pl = 0.3588

# Planet mass in Jupiter masses
# No measured mass available.
# Estimated from Otegi et al. (2020) volatile-rich M-R relation:
# Rp = 4.0217 ± 0.4567 R_earth -> Mp = 15.69 ± 2.81 M_earth
M_pl = 0.0494

# Semi-major axis in [AU]
# Computed from P = 10.3088514 d and M_star = 0.950 M_sun
a_pl = 0.0911

# Stellar radius in Solar radii
R_star = 0.8437

# Planet-to-star radius ratio
# Computed from Rp = 4.021746 R_earth and R_star = 0.843702 R_sun
planet_to_star_ratio = 0.04365

# Impact parameter
# No reliable fitted b found. Adopted near-central value because T14 = 3.80 ± 0.20 hr
# is consistent with a long, low-impact transit given uncertainties/systematics.
b = 0.10

# Scaled semi-major axis
# Computed from a_pl and R_star
a_over_Rs = 23.23

# Equilibrium temperature in K
# From ExoFOP
T_eq = 729.1

# Age-informed stellar high-energy template
stellar_spectrum = young-Sun
